{% load static %}
<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Website Portofolio Profesional Lulusan Teknik Informatika">
    <title>{% block title %}Portofolio Profesional{% endblock %}</title>
    <!-- Modern Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- Styling -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <!-- 3D Perspective Tunnel Background Layer -->
    <div id="bg-layer" class="bg-layer">
        <div class="tunnel-container" id="tunnel-container">
            <div class="tunnel-wall wall-top"></div>
            <div class="tunnel-wall wall-bottom"></div>
        </div>
        
        <!-- Subtle Ambient Orbs -->
        <div class="bg-ornaments">
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>
        </div>
    </div>

    <!-- Navbar dengan Glassmorphism -->
    <nav class="navbar glass">
        <div class="logo"></div>

        <!-- Tombol Menu Mobile -->
        <button class="mobile-menu-btn" aria-label="Toggle Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <ul class="nav-links">
            <li><a href="#hero">Beranda</a></li>
            <li><a href="#about">Profil</a></li>
            <li><a href="#projects">Proyek</a></li>
            <li><a href="#contact" class="btn-primary-small">Hubungi Saya</a></li>
            <li>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Light Mode">
                    <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </li>
        </ul>
    </nav>

    <div id="fp-wrapper">
    <main>
        {% block content %}{% endblock %}
    </main>

    <footer id="contact" class="footer"
        style="padding: 3rem 5% 2rem; text-align: center; border-top: 1px solid var(--glass-border); background: var(--bg-surface); margin-top: 3rem;">
        <div class="footer-content"
            style="max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; align-items: center;">
            <h2 class="cinematic-section-title" style="font-size: 1.6rem; margin-bottom: 0;">HUBUNGI <span
                    class="accent">SAYA</span></h2>

            <div
                style="display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; color: var(--text-muted); margin-top: 0.5rem;">
                <div style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.95rem;">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.242-4.243a8 8 0 1111.314 0z">
                        </path>
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z">
                        </path>
                    </svg>
                    <span>Samarinda, Kalimantan Timur</span>
                </div>

                <div style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.95rem;">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                        </path>
                    </svg>
                    <a href="mailto:panduwirayuda12345@gmail.com"
                        style="color: var(--text-muted); text-decoration: none; transition: color 0.3s;"
                        onmouseover="this.style.color='var(--accent)'"
                        onmouseout="this.style.color='var(--text-muted)'">panduwirayuda12345@gmail.com</a>
                </div>

                <div style="display: flex; align-items: center; gap: 0.4rem; font-size: 0.95rem;">
                    <svg width="16" height="16" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
                    </svg>
                    <a href="https://www.linkedin.com/in/pandu-wirayuda/" target="_blank"
                        style="color: var(--text-muted); text-decoration: none; transition: color 0.3s;"
                        onmouseover="this.style.color='var(--accent)'"
                        onmouseout="this.style.color='var(--text-muted)'">LinkedIn: Pandu Wirayuda</a>
                </div>
            </div>
        </div>
    </footer>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox">
        <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
        <div id="lightbox-info" class="lightbox-info">
            <h3 id="lightbox-title"></h3>
            <p id="lightbox-desc"></p>
            <div id="lightbox-tags" class="project-tags" style="justify-content: center; margin-top: 15px;"></div>
        </div>
        <div class="lightbox-content-container">
            <button class="lightbox-prev" onclick="changeSlide(-1)">&#10094;</button>
            <div id="lightbox-content" class="lightbox-content"></div>
            <button class="lightbox-next" onclick="changeSlide(1)">&#10095;</button>
        </div>
        <div id="lightbox-indicators" class="lightbox-indicators"></div>
    </div>

    <!-- Circular Progress Indicator -->
    <div id="circular-progress" class="circular-progress" title="Back to top">
        <svg class="progress-ring" width="50" height="50">
            <circle class="progress-ring__bg" stroke="rgba(255,255,255,0.1)" stroke-width="4" fill="transparent" r="22" cx="25" cy="25"/>
            <circle class="progress-ring__circle" stroke="var(--accent)" stroke-width="4" fill="transparent" r="22" cx="25" cy="25"/>
        </svg>
        <div class="progress-arrow">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
        </div>
    </div>

    <!-- Scripts -->
    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
